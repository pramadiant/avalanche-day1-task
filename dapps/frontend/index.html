<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avalanche Wallet Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-shape1"></div>
    <div class="bg-shape2"></div>

    <div class="container glass-effect">
      <div class="header">
          <h1>Avalanche dApp</h1>
          <p class="subtitle">Web3 Fundamental Day 1</p>
      </div>

      <button id="connectBtn" class="glow-on-hover">
          <span>Connect Wallet</span>
      </button>

      <div class="info-card glass-effect-inner">
        <div class="data-row">
            <span class="label">Status</span>
            <span id="status" class="value status-indicator">Not Connected</span>
        </div>
        
        <div class="data-row address-row">
            <span class="label">Address</span>
            <span id="address" class="value address-box">-</span>
        </div>
        
        <div class="data-row">
            <span class="label">Network</span>
            <span id="network" class="value">-</span>
        </div>

        <div class="data-row">
            <span class="label">Balance</span>
            <span class="value"><span id="balance">-</span> AVAX</span>
        </div>

        <div class="divider"></div>

        <div class="student-info">
            <p class="student-label">Student Info</p>
            <div class="data-row slim">
                <span class="label">Nama</span>
                <span id="studentName" class="value highlight-text">-</span>
            </div>
            <div class="data-row slim">
                <span class="label">NIM</span>
                <span id="studentNim" class="value highlight-text">-</span>
            </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
